# opencode-db.conf — optional configuration for opencode-db-exporter.
# Paths and preferences only; contains no secrets. Every variable is commented:
# uncomment and edit to override a default. Precedence: environment > this file
# > built-in default (an exported variable is never clobbered by this file).

# --- Paths ---
# OPENCODE_DB="$HOME/.local/share/opencode/opencode.db"
# OCED_OUT="$HOME/.local/share/opencode-db-exporter/exports"
# OCED_BACKUP_DIR="$HOME/.local/share/opencode-db-exporter/backups"
# OCED_PRESETS="$HOME/.config/opencode-db/presets.json"
# OCED_SHRINK_PRESETS="$HOME/.config/opencode-db/shrink-presets.json"

# --- Preferences ---
# OCED_COMPRESS=1          # gzip backups (0 = raw). Default 1.
# OCED_LOG=0               # 1 appends one line per backup/prune/shrink to OCED_ACTIVITY_LOG
# OCED_ACTIVITY_LOG="$HOME/.local/state/opencode-db/activity.log"
# OCED_TZ=Europe/Madrid    # menu picker rows only; the CLI/files stay UTC (unset = system TZ)
# OCED_SHRINK_DISCARD_EXPORT_PROFILE=review  # export that protects a --discard-sessions discard; must keep subagents (the shrink offer warns if it would drop them)

# presets.json / shrink-presets.json hold the named recipes (install.sh refreshes
# them from the shipped copies). Run `opencode-db help` for their format and flags.
