# opencode-db.conf — optional configuration for opencode-db-exporter.
# Copy to ~/.config/opencode-db/opencode-db.conf (permissions 600).
# Paths and preferences only; contains no secrets.
# Any omitted variable uses the default from src/common.sh.
# Precedence: environment > this conf file > built-in default (an exported
# variable is never clobbered by this file).

# Path to the opencode database (default).
# OPENCODE_DB="$HOME/.local/share/opencode/opencode.db"

# Output directories. By default they live under ~/.local/share/opencode-db-exporter/.
# OCED_OUT="$HOME/.local/share/opencode-db-exporter/exports"
# OCED_BACKUP_DIR="$HOME/.local/share/opencode-db-exporter/backups"

# Compress backups with gzip: 1 (yes) or 0 (no). Default 1.
# OCED_COMPRESS=1

# Opt-in activity log: 1 appends one timestamped line per significant action
# (backup, prune, shrink) to OCED_ACTIVITY_LOG. Default 0 (no log file).
# OCED_LOG=0
# OCED_ACTIVITY_LOG="$HOME/.local/state/opencode-db/activity.log"

# Named export presets (JSON source of truth for `export <name>` and the menu).
# install.sh auto-creates it from the shipped presets.json when missing.
# Example:
# {"presets": {"clean": {"product": "transcript", "json": true, "sanitize": true,
#                          "no_reasoning": true, "filter": "Project Beta"},
#              "everything": {"products": {"transcript": {"json": true, "tool_output": "full"},
#                                          "memory": {"files": true}}}}}
# Keys allowed: product (single) or products (bundle map product->flags) + sub,
# tool_output, patch, role, cap, json, sanitize, files, no_reasoning,
# mark_compactions, summary_diffs, tool_input_limit, tool_output_limit,
# filter (LIKE) or sessions (exact ids). Empty/missing file = no presets.
# OCED_PRESETS="$HOME/.config/opencode-db/presets.json"

# Named shrink recipes (JSON source of truth for `shrink <name>` and the menu).
# install.sh auto-creates it from the shipped shrink-presets.json when missing.
# A recipe carries ONLY operations (today: strip_reasoning). The session selection
# is separate: the menu asks you with its picker, the CLI uses one keep rule
# (--keep | --older-than | --since | --keep-all | --keep-sessions |
# --discard-sessions). A keep rule inside a recipe is rejected.
# The shipped recipes lean/quiet always exist; this file extends or overrides them.
# Example: {"presets": {"lean": {"strip_reasoning": true}, "quiet": {}}}
# Missing file = built-in recipes only. `shrink --list-presets` shows the set.
# OCED_SHRINK_PRESETS="$HOME/.config/opencode-db/shrink-presets.json"

# Which export protects what a `shrink --discard-sessions` is about to drop.
# The menu's plan and the engine's own post-build note both print
#   opencode-db export <this> --sessions <the sessions being dropped>
# so a wrong name here would only fail later, inside that export. Valid values:
# any export PRODUCT (transcript | memory | digest) or any preset name from the
# presets file above (archive = transcript + memory is the default: the widest
# readable reference). An invalid name is reported with the valid list and falls
# back to `archive` (or `transcript` when there are no presets).
#
#   Choose one that KEEPS subagents. The offer exports the whole discard cascade
#   (the discarded sessions AND their subagents), but a preset that sets
#   `no_subagents` / `no_orphan_subagents`, or `sub: omit`, would drop them from
#   the export anyway — and the export would still succeed, quietly losing them.
#   The shrink offer warns on screen when the profile you pick has that shape.
# OCED_SHRINK_DISCARD_EXPORT_PROFILE=archive
